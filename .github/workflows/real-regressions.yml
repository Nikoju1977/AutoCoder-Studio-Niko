name: Code Mode Pro real functional regressions
on:
  pull_request:
    branches: [main, feature/code-mode-x-v1]
    paths:
      - 'scripts/real-regressions.mjs'
      - 'tests/real-regression-fixtures.json'
      - '.github/workflows/real-regressions.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare Node image
        run: |
          docker pull node:22-bookworm-slim
          echo "CMX_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' node:22-bookworm-slim)" >> "$GITHUB_ENV"
      - name: Compare original and corrected public source
        run: node scripts/real-regressions.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-regression-report
          path: |
            real-regression-report.json
            real-regression-evidence.md
          if-no-files-found: warn
