name: AutoCoder checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/autocoder-http.log 2>&1 &
          sleep 2
          npm run test:e2e
