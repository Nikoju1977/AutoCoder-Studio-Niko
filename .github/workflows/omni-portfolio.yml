name: OMNI portfolio read-only
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
  actions: read
concurrency:
  group: omni-portfolio
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate scanner
        run: node --test tests/omni-portfolio.test.mjs
      - name: Inventory public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/omni-portfolio.mjs
      - name: Upload public metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-public-report
          path: omni-public-report.json
          if-no-files-found: warn
          retention-days: 7
