name: Code Mode Pro fleet interoperability
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public repositories read-only interoperability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fleet-audit.mjs
