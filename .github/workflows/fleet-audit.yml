name: Code Mode Pro fleet interoperability
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public repositories read-only interoperability (batches of three)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEET_SHARD: ${{ matrix.shard }}
          FLEET_SHARDS: 6
        run: node scripts/fleet-audit.mjs
      - name: Preserve partial audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-audit-${{ matrix.shard }}
          path: fleet-audit-${{ matrix.shard }}.json
          if-no-files-found: warn
